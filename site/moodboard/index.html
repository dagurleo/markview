<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markview — landing page mood board</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f8f1e3; --paper-subtle: #efe5d3; --paper-border: #e0d4bf; --paper-muted: #7a6c5a;
    --ink: #3b3226; --sienna: #9b4d1f; --mark: #f3dc9a;
    --night: #26221d; --night-text: #e6dccb; --night-link: #e0a36b;
    --graphite-1: #3d4252; --graphite-2: #171a21;
    --hand: "Caveat", "Bradley Hand", cursive;
    --serif: "Instrument Serif", "New York", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3a2a1c; font-family: var(--sans); }

  /* The toolbar, pinned above the board. */
  .bar {
    position: fixed; inset: 12px 12px auto 12px; z-index: 100000; display: flex; gap: 8px; align-items: center;
    padding: 8px 10px 8px 14px; border-radius: 14px; color: #f7efe2;
    background: rgba(32, 23, 15, 0.72); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 8px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
    font-size: 13px;
  }
  .bar b { font-weight: 650; letter-spacing: -0.01em; }
  .bar .hint { opacity: .65; margin-left: 6px; }
  .bar .spacer { flex: 1; }
  .bar button {
    font: inherit; color: inherit; background: rgba(255,255,255,.1); border: 0; border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
  }
  .bar button:hover { background: rgba(255,255,255,.2); }
  .bar .zoom { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; opacity: .8; }

  /* The cork. */
  .viewport { position: fixed; inset: 0; overflow: auto; cursor: grab; }
  .viewport.panning { cursor: grabbing; }
  .board {
    position: relative; width: 3000px; height: 2010px; transform-origin: 0 0;
    background-color: #b8834f;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22 0 0 0 0 .12 0 0 0 0 .04 0 0 0 1.1 -.35'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.035' numOctaves='2' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .95 0 0 0 0 .75 0 0 0 0 .5 0 0 0 1.4 -.75'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='d'><feTurbulence type='turbulence' baseFrequency='.5' numOctaves='1' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .18 0 0 0 0 .09 0 0 0 0 .02 0 0 0 -2.6 1.55'/></filter><rect width='100%' height='100%' filter='url(%23d)'/></svg>");
    box-shadow: inset 0 0 0 18px #6b4426, inset 0 0 0 22px #4f301a, inset 0 0 60px 30px rgba(40,20,5,.45);
  }
  .yarn { position: absolute; inset: 0; pointer-events: none; z-index: 90000; overflow: visible; }
  .yarn path { fill: none; stroke: #b3261e; stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }

  /* Everything pinned. */
  .item { position: absolute; transform: rotate(var(--r, 0deg)); transition: transform .18s ease, box-shadow .18s ease, filter .18s; user-select: none; }
  .item.dragging { transform: rotate(var(--r, 0deg)) scale(1.03); transition: none; filter: drop-shadow(0 24px 22px rgba(0,0,0,.35)); cursor: grabbing; }
  .item:not(.dragging) { filter: drop-shadow(0 6px 5px rgba(0,0,0,.28)) drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .pin {
    position: absolute; top: -9px; left: calc(50% - 10px); width: 20px; height: 20px; border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 35% 30%, #fff8 0 2px, transparent 4px), radial-gradient(circle at 50% 50%, var(--pin, #d1342c) 0 58%, color-mix(in srgb, var(--pin, #d1342c) 60%, black) 100%);
    box-shadow: 0 3px 3px rgba(0,0,0,.4), 2px 6px 6px rgba(0,0,0,.2);
  }
  .tape {
    position: absolute; top: -14px; width: 110px; height: 30px; left: calc(50% - 55px); z-index: 2;
    background: rgba(250, 240, 200, .62); box-shadow: 0 1px 2px rgba(0,0,0,.15);
    clip-path: polygon(3% 0, 97% 4%, 100% 30%, 98% 62%, 100% 100%, 2% 96%, 0 70%, 3% 40%);
    transform: rotate(-3deg);
  }

  .card { background: #fffdf8; padding: 22px 24px; border-radius: 2px; color: #2c2620; }
  .card.lined { background: #fffdf8 repeating-linear-gradient(transparent 0 27px, #c7d9ea 27px 28px); background-position: 0 52px; }
  .card.lined::before { content: ""; position: absolute; left: 36px; top: 0; bottom: 0; width: 1.5px; background: #e9a3a3; }
  .card h2 { font: 700 34px/1 var(--hand); margin: 0 0 12px; }
  .card p, .card li { font: 500 22px/28px var(--hand); margin: 0; }
  .card.lined p, .card.lined ul { padding-left: 24px; }
  .card ul { padding-left: 24px; margin: 0; }
  .label { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin-bottom: 10px; }

  .sticky { padding: 22px 20px 18px; border-radius: 2px 2px 14px 2px / 2px 2px 30px 2px; cursor: pointer; }
  .sticky .text { font: 700 27px/1.12 var(--hand); color: #2e2a20; outline: none; }
  .sticky .text mark { background: linear-gradient(transparent 52%, rgba(255,255,255,.75) 52% 90%, transparent 90%); color: inherit; }
  .sticky .use { position: absolute; bottom: 8px; right: 10px; font: 600 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; opacity: 0; transition: opacity .15s; color: #2e2a20; }
  .sticky:hover .use { opacity: .55; }
  .sticky.chosen { box-shadow: 0 0 0 3px #2e2a20, 0 0 0 7px rgba(255,255,255,.6); }
  .sticky.chosen .use { opacity: .8; }

  .polaroid { background: #fbfbf8; padding: 10px 10px 0; }
  .polaroid img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; background: #ddd; }
  .polaroid .cap { font: 600 21px/1.05 var(--hand); color: #24201b; padding: 9px 4px 12px; }
  .polaroid .cap b { font-weight: 700; color: #a8322a; }

  .print img { display: block; width: 100%; border-radius: 10px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
  .print .note { position: absolute; bottom: -34px; right: 6px; font: 700 24px var(--hand); color: #fff6e6; text-shadow: 0 1px 2px rgba(0,0,0,.5); white-space: nowrap; }

  .chips { background: #fffdf8; padding: 14px 14px 10px; }
  .chip { display: flex; align-items: end; justify-content: space-between; height: 54px; padding: 6px 9px; margin-bottom: 6px; border-radius: 2px; cursor: copy; font: 600 11px/1.2 var(--mono); }
  .chip span:first-child { font-family: var(--sans); font-weight: 600; }
  .chips .name { font: 700 24px/1 var(--hand); color: #2a241d; margin: 2px 2px 10px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 100001;
    background: #1e1813; color: #f8f1e3; font: 600 13px var(--sans); padding: 9px 14px; border-radius: 999px; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  .dots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px 10px; margin-top: 6px; }
  .dot { display: grid; justify-items: center; gap: 5px; cursor: pointer; font: 600 10.5px var(--sans); color: #4a4036; }
  .dot i { width: 42px; height: 42px; border-radius: 50%; display: block; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .15s; }
  .dot i::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--a); box-shadow: 0 0 0 2px rgba(255,255,255,.18); }
  .dot:hover i { transform: scale(1.12); }
  .dot.on i { outline: 2.5px solid #2a241d; outline-offset: 3px; }
  .switch { display: flex; gap: 6px; margin-top: 16px; }
  .switch button { font: 600 12px var(--sans); border: 1px solid #d9cdb8; background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .switch button.on { background: #2a241d; color: #fff; border-color: #2a241d; }

  .receipt {
    background: #fbfaf6; padding: 22px 22px 34px; font: 500 14px/1.6 var(--mono); color: #2b2b2b;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), 95% 100%, 90% calc(100% - 10px), 85% 100%, 80% calc(100% - 10px), 75% 100%, 70% calc(100% - 10px), 65% 100%, 60% calc(100% - 10px), 55% 100%, 50% calc(100% - 10px), 45% 100%, 40% calc(100% - 10px), 35% 100%, 30% calc(100% - 10px), 25% 100%, 20% calc(100% - 10px), 15% 100%, 10% calc(100% - 10px), 5% 100%, 0 calc(100% - 10px));
  }
  .receipt h3 { text-align: center; font: 600 15px var(--mono); letter-spacing: .2em; margin: 0 0 2px; }
  .receipt .c { text-align: center; opacity: .6; font-size: 12px; }
  .receipt .row { display: flex; justify-content: space-between; gap: 10px; }
  .receipt hr { border: 0; border-top: 1.5px dashed #999; margin: 10px 0; }
  .receipt .total { font-weight: 600; font-size: 16px; }

  .spec { background: #fffdf8; padding: 18px 22px 20px; }
  .spec .big { line-height: 1; color: #2a231b; margin: 6px 0 10px; }
  .spec .small { font: 15px/1.45 var(--sans); color: #5b5044; }

  /* The wireframe. */
  .wire { background: #fffdf8 repeating-linear-gradient(0deg, transparent 0 19px, #e9eef5 19px 20px), repeating-linear-gradient(90deg, transparent 0 19px, #e9eef5 19px 20px); padding: 20px 22px; }
  .wire .blk { border: 2px dashed #6f6457; border-radius: 6px; margin: 7px 0; padding: 6px 10px; font: 600 19px/1.1 var(--hand); color: #3a3229; display: flex; justify-content: space-between; align-items: center; background: rgba(255,253,248,.85); }
  .wire .blk small { font: 500 16px var(--hand); opacity: .7; }

  /* Hero direction mockups: a 1200 × 860 page at a fraction of the size. */
  .direction { background: #fffdf8; padding: 12px 12px 0; }
  .direction .frame { width: 560px; height: 401px; overflow: hidden; border-radius: 6px; position: relative; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  .direction .mock { width: 1200px; height: 860px; transform: scale(.4667); transform-origin: 0 0; position: absolute; inset: 0 auto auto 0; overflow: hidden; }
  .direction .cap { font: 700 26px/1 var(--hand); color: #23201b; padding: 12px 4px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .direction .cap span { font-weight: 500; font-size: 20px; opacity: .65; }

  .mock nav { display: flex; align-items: center; gap: 30px; padding: 26px 48px; font: 500 17px var(--sans); }
  .mock nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; margin-right: auto; }
  .mock nav .brand img { width: 34px; height: 34px; }
  .mock nav .cta { padding: 9px 16px; border-radius: 999px; font-weight: 600; }
  .mock .center { text-align: center; padding: 0 120px; }
  .mock .pill { display: inline-block; font: 600 15px var(--sans); padding: 7px 14px; border-radius: 999px; margin: 34px 0 22px; }
  .mock h1 { margin: 0 auto; max-width: 960px; }
  .mock .lede { font: 400 23px/1.45 var(--sans); max-width: 700px; margin: 22px auto 30px; }
  .mock .buttons { display: flex; justify-content: center; gap: 14px; align-items: center; }
  .mock .btn { font: 600 19px var(--sans); padding: 15px 26px; border-radius: 14px; display: inline-flex; gap: 10px; align-items: center; }
  .mock .brew { font: 500 16px var(--mono); padding: 15px 20px; border-radius: 14px; }
  .mock .req { font: 500 15px var(--sans); margin-top: 18px; opacity: .65; }
  .mock .shot { position: absolute; left: 50%; transform: translateX(-50%); width: 980px; border-radius: 14px; }

  .mock.paper { background: var(--paper); color: var(--ink); }
  .mock.paper nav .cta { background: var(--ink); color: var(--paper); }
  .mock.paper .pill { background: var(--paper-subtle); color: var(--paper-muted); box-shadow: inset 0 0 0 1px var(--paper-border); }
  .mock.paper h1 { font: 400 92px/1 var(--serif); letter-spacing: -0.01em; }
  .mock.paper h1 mark { background: linear-gradient(100deg, transparent 0 2%, var(--mark) 3% 97%, transparent 98%); color: inherit; padding: 0 .08em; border-radius: .1em; }
  .mock.paper h1 code { font: 400 .8em var(--mono); background: var(--paper-subtle); padding: 0 .15em; border-radius: .15em; }
  .mock.paper .lede { color: var(--paper-muted); }
  .mock.paper .btn { background: var(--sienna); color: #fff8ee; box-shadow: 0 6px 16px rgba(155,77,31,.3); }
  .mock.paper .brew { background: var(--paper-subtle); color: var(--ink); box-shadow: inset 0 0 0 1px var(--paper-border); }
  .mock.paper .shot { top: 590px; box-shadow: 0 30px 60px rgba(59,50,38,.28), 0 0 0 1px rgba(59,50,38,.12); }

  .mock.graphite { background: radial-gradient(1000px 640px at 50% -10%, var(--graphite-1), var(--graphite-2) 70%); color: #f4f5f8; }
  .mock.graphite nav { color: #c9cdd8; }
  .mock.graphite nav .cta { background: #fff; color: #15171d; }
  .mock.graphite .tile { width: 112px; height: 112px; margin: 26px auto 22px; display: block; filter: drop-shadow(0 18px 30px rgba(0,0,0,.5)); }
  .mock.graphite h1 { font: 800 76px/1.02 var(--sans); letter-spacing: -0.035em; }
  .mock.graphite h1 mark { background: none; color: transparent; background-image: linear-gradient(90deg, #ff7b72, #d2a8ff, #79c0ff); -webkit-background-clip: text; background-clip: text; }
  .mock.graphite h1 code { font: 600 .8em var(--mono); color: #a5d6ff; }
  .mock.graphite .lede { color: #9ba1b0; margin: 20px auto 22px; }
  .mock.graphite .themedots { display: flex; justify-content: center; gap: 9px; margin: 0 0 26px; }
  .mock.graphite .themedots i { width: 16px; height: 16px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .mock.graphite .btn { background: #f4f5f8; color: #15171d; }
  .mock.graphite .brew { background: rgba(255,255,255,.07); color: #c9cdd8; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .mock.graphite .shot { top: 640px; box-shadow: 0 -10px 120px rgba(121,192,255,.18), 0 30px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); }

  .mock.source { background: #fcfbf8; color: #24292f;
    background-image: linear-gradient(#eef0f3 1px, transparent 1px), linear-gradient(90deg, #eef0f3 1px, transparent 1px); background-size: 32px 32px; }
  .mock.source nav { font-family: var(--mono); font-size: 15px; color: #57606a; }
  .mock.source nav .brand { font-family: var(--sans); color: #24292f; }
  .mock.source nav .cta { background: #24292f; color: #fff; font-family: var(--sans); }
  .mock.source .split { display: grid; grid-template-columns: 1fr 60px 1fr; gap: 0; padding: 40px 56px 0; align-items: start; }
  .mock.source .src { font: 400 21px/1.75 var(--mono); color: #57606a; background: rgba(255,255,255,.85); border: 1px solid #d0d7de; border-radius: 14px; padding: 26px 28px; white-space: pre-wrap; }
  .mock.source .src .h { color: #cf222e; } .mock.source .src .s { color: #8250df; } .mock.source .src .k { color: #0550ae; }
  .mock.source .arrow { align-self: center; text-align: center; font: 600 15px var(--mono); color: #8c959f; }
  .mock.source .arrow b { display: block; font-size: 30px; color: #24292f; }
  .mock.source .out { padding: 6px 4px; }
  .mock.source .out .t { font: 700 64px/1 var(--sans); letter-spacing: -0.03em; padding-bottom: 14px; border-bottom: 1px solid #d8dee4; margin-bottom: 18px; }
  .mock.source .out h1 { font: 600 34px/1.2 var(--sans); letter-spacing: -0.01em; max-width: none; }
  .mock.source .out h1 mark { background: #fff8c5; color: inherit; }
  .mock.source .out h1 code { font: 500 .85em var(--mono); background: #eff1f3; padding: 0 .2em; border-radius: 6px; }
  .mock.source .out .alert { border-left: 4px solid #1a7f37; padding: 4px 16px; margin: 22px 0; font: 19px/1.5 var(--sans); }
  .mock.source .out .alert b { color: #1a7f37; display: block; }
  .mock.source .out pre { background: #f6f8fa; border-radius: 10px; padding: 16px 18px; font: 16px var(--mono); margin: 0; }
  .mock.source .out .btn { background: #24292f; color: #fff; margin-top: 22px; }
</style>
</head>
<body>
<div class="bar">
  <b>Markview · landing page mood board</b>
  <span class="hint">Drag anything · double-click the cork for a note · click a headline to try it on the three directions · click a swatch to copy it</span>
  <span class="spacer"></span>
  <button id="out" title="Zoom out">−</button><span class="zoom" id="zoomLabel">100%</span><button id="in" title="Zoom in">+</button>
  <button id="fit">Fit</button>
  <button id="reset" title="Put everything back where it started">Reset layout</button>
</div>
<div class="viewport" id="viewport"><div class="board" id="board"><svg class="yarn" id="yarn"></svg></div></div>
<div class="toast" id="toast"></div>

<script>
const shots = '../public/shots/';
const refs = 'refs/thumbs/';

// The twelve themes, from Native/Palette.swift: background, text and link, light and dark.
const themes = [
  ['github', 'GitHub', '#ffffff', '#0969da', '#1c1c1e', '#58a6ff'],
  ['solarized', 'Solarized', '#fdf6e3', '#268bd2', '#002b36', '#268bd2'],
  ['one', 'One', '#fafafa', '#4078f2', '#282c34', '#61afef'],
  ['monokai', 'Monokai', '#fafaf8', '#0083a8', '#272822', '#66d9ef'],
  ['dracula', 'Dracula', '#fffbeb', '#036a96', '#282a36', '#ff79c6'],
  ['nord', 'Nord', '#eceff4', '#5e81ac', '#2e3440', '#88c0d0'],
  ['tokyo-night', 'Tokyo Night', '#e1e2e7', '#2e7de9', '#1a1b26', '#7aa2f7'],
  ['catppuccin', 'Catppuccin', '#eff1f5', '#1e66f5', '#1e1e2e', '#cba6f7'],
  ['gruvbox', 'Gruvbox', '#fbf1c7', '#076678', '#282828', '#fabd2f'],
  ['ayu', 'Ayu', '#fcfcfc', '#399ee6', '#1f2430', '#ffcc66'],
  ['rose-pine', 'Rosé Pine', '#faf4ed', '#286983', '#191724', '#ebbcba'],
  ['paper', 'Paper', '#f8f1e3', '#9b4d1f', '#26221d', '#e0a36b'],
];

const headlines = [
  ['Press Space. ==Read== Markdown.', '#fde58a'],
  ['Markdown, ==beautifully== read.', '#ffc2d1'],
  ['The Markdown ~~editor~~ ==viewer== your Mac was missing.', '#bfe3ff'],
  ['Read the **README**. ==Properly.==', '#c9f2c7'],
  ['Small, native, and ==quick== to read.', '#fde58a'],
  ['Open a `.md` file. ==That’s it.==', '#ffd7a8'],
  ['No web view. No Electron. ==Just your Markdown.==', '#e3d4ff'],
  ['Your Markdown, *as it was ==meant== to look.*', '#bfe3ff'],
];

// Inline Markdown for the headlines: ==mark==, **strong**, ~~del~~, *em*, `code`.
function md(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/==(.+?)==/g, '<mark>$1</mark>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}
function sourceHTML(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/(==|\*\*|~~|`|\*)/g, '<span class="s">$1</span>');
}

const lede = 'A small, native Markdown viewer for macOS. Open a file and read it as it changes, or press Space on one in Finder.';
const apple = '<svg width="17" height="20" viewBox="0 0 17 20" fill="currentColor"><path d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.3.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4zM11.6 3c.7-.9 1.2-2 1-3.2-1 0-2.2.7-3 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.3-.6 3-1.4z"/></svg>';

const directions = {

function render(item) {
  const el = document.createElement('div');
  el.className = 'item ' + item.kind;
  el.dataset.id = item.id;
  const place = saved[item.id] || item;
  el.style.left = place.x + 'px';
  el.style.top = place.y + 'px';
  if (item.w) el.style.width = item.w + 'px';
  if (item.h) el.style.minHeight = item.h + 'px';
  el.style.setProperty('--r', (item.r || 0) + 'deg');
  const fastener = item.tape ? '<div class="tape"></div>' : `<div class="pin" style="--pin:${item.pin || '#d1342c'}"></div>`;
  const type = item.kind.includes('note') ? 'note' : item.kind.split(' ')[0];
  switch (type) {
    case 'polaroid':
      el.innerHTML = `${fastener}<img ${item.photoId ? `id="${item.photoId}"` : ''} src="${item.src}" alt="" draggable="false"><div class="cap">${item.cap.replace(/==(.+?)==/g, '<mark style="background:#f3dc9a">$1</mark>')}</div>`;
      break;
    case 'print':
      el.innerHTML = `<div class="tape"></div><img src="${item.src}" alt="" draggable="false"><div class="note">${item.note}</div>`;
      break;
    case 'sticky':
      el.style.background = `linear-gradient(170deg, ${item.color}, color-mix(in srgb, ${item.color} 88%, #8a6a00))`;
      el.innerHTML = `${fastener}<div class="text">${md(item.text)}</div><div class="use">${item.text === chosen ? 'on the mockups' : 'try this'}</div>`;
      el.dataset.headline = item.text;
      if (item.text === chosen) el.classList.add('chosen');
      break;
    case 'chips':
      el.innerHTML = `${fastener}<div class="name">${item.name}</div>` + item.chips.map(([name, hex]) => {
        const light = parseInt(hex.slice(1, 3), 16) * .3 + parseInt(hex.slice(3, 5), 16) * .59 + parseInt(hex.slice(5, 7), 16) * .11 > 150;
        return `<div class="chip" data-hex="${hex}" style="background:${hex};color:${light ? '#2a241d' : '#fffaf0'}"><span>${name}</span><span>${hex}</span></div>`;
      }).join('');
      break;
    case 'direction':
      el.innerHTML = `${fastener}<div class="frame"><div class="mock ${item.dir}">${directions[item.dir]()}</div></div><div class="cap">${item.title}<span>${item.sub}</span></div>`;
      break;
    case 'note':
      el.style.background = item.color;
      el.innerHTML = `${fastener}<div class="text" contenteditable="true" spellcheck="false">${item.text}</div>`;
      el.querySelector('.text').addEventListener('input', saveNotes);
      break;
    default:
      el.innerHTML = fastener + item.html;
  }
  board.appendChild(el);
  return el;
}

// Dragging, with clicks told apart from drags by distance.
let drag = null, scale = 1, zTop = 1000;
board.addEventListener('pointerdown', e => {
  const el = e.target.closest('.item');
  if (!el || e.button !== 0) return;
  if (e.target.isContentEditable && document.activeElement === e.target) return;
  e.stopPropagation();
  drag = { el, x: e.clientX, y: e.clientY, left: parseFloat(el.style.left), top: parseFloat(el.style.top), moved: false };
  el.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = (e.clientX - drag.x) / scale, dy = (e.clientY - drag.y) / scale;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  if (!drag.moved) { drag.moved = true; drag.el.classList.add('dragging'); drag.el.style.zIndex = ++zTop; }
  drag.el.style.left = drag.left + dx + 'px';
  drag.el.style.top = drag.top + dy + 'px';
  drawYarn();
});
board.addEventListener('pointerup', e => {
  if (!drag) return;
  const { el, moved } = drag;
  drag = null;
  el.classList.remove('dragging');
  if (moved) {
    if (el.classList.contains('note')) saveNotes();
    else { saved[el.dataset.id] = { x: parseFloat(el.style.left), y: parseFloat(el.style.top) }; localStorage.setItem('mv-moodboard', JSON.stringify(saved)); }
    return;
  }
  // A click.
  const chip = e.target.closest('.chip');
  if (chip) { navigator.clipboard?.writeText(chip.dataset.hex); toast(`Copied ${chip.dataset.hex}`); return; }
  if (el.dataset.headline) { chosen = el.dataset.headline; localStorage.setItem('mv-moodboard-headline', chosen); applyHeadline(); toast('Headline on all three directions'); return; }
  if (el.classList.contains('note')) el.querySelector('.text').focus();
});

// Double-click the cork for a note of your own.
const noteColors = ['#fde58a', '#ffc2d1', '#bfe3ff', '#c9f2c7', '#ffd7a8'];
board.addEventListener('dblclick', e => {
  if (e.target !== board) return;
  const rect = board.getBoundingClientRect();
  const note = { id: 'note-' + Date.now(), x: (e.clientX - rect.left) / scale - 100, y: (e.clientY - rect.top) / scale - 20, w: 200, h: 170,
    r: Math.random() * 6 - 3, color: noteColors[Math.floor(Math.random() * noteColors.length)], text: 'An idea…' };
  const el = render({ ...note, kind: 'sticky note', pin: '#d1342c' });
  el.style.zIndex = ++zTop;
  const text = el.querySelector('.text');
  text.focus();
  document.getSelection().selectAllChildren(text);
  saveNotes();
});
function saveNotes() {
  const list = [...board.querySelectorAll('.note')].map(el => ({
    id: el.dataset.id, x: parseFloat(el.style.left), y: parseFloat(el.style.top), w: 200, h: 170,
    r: parseFloat(el.style.getPropertyValue('--r')), color: el.style.background, text: el.querySelector('.text').innerHTML }));
  localStorage.setItem('mv-moodboard-notes', JSON.stringify(list));
}
document.addEventListener('keydown', e => {
  const el = document.activeElement;
  if ((e.key === 'Backspace' || e.key === 'Delete') && el?.isContentEditable && el.textContent === '') { el.closest('.note').remove(); saveNotes(); }
  if (e.key === 'Escape') el?.blur();
});

// Yarn, sagging between pins.
function pinPoint(id) {
  const el = board.querySelector(`[data-id="${id}"]`);
  return el && { x: parseFloat(el.style.left) + el.offsetWidth / 2, y: parseFloat(el.style.top) + 2 };
}
function drawYarn() {
  yarn.innerHTML = strings.map(([a, b]) => {
    const p = pinPoint(a), q = pinPoint(b);
    if (!p || !q) return '';
    const sag = 30 + Math.hypot(q.x - p.x, q.y - p.y) * 0.1;
    return `<path d="M${p.x} ${p.y} Q ${(p.x + q.x) / 2} ${(p.y + q.y) / 2 + sag} ${q.x} ${q.y}"/>`;
  }).join('');
}
window.addEventListener('load', drawYarn);
drawYarn();

// Zoom and pan.
function setScale(next, focus) {
  const old = scale;
  scale = Math.min(1.6, Math.max(0.3, next));
  board.style.transform = `scale(${scale})`;
  board.parentElement.style.width = '';
  document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
  const sizer = document.getElementById('sizer') || Object.assign(document.createElement('div'), { id: 'sizer' });
  sizer.style.cssText = `position:absolute;left:0;top:0;width:${3000 * scale}px;height:${2010 * scale}px;pointer-events:none`;
  viewport.appendChild(sizer);
  board.style.position = 'absolute';
  if (focus) {
    viewport.scrollLeft = (viewport.scrollLeft + focus.x) * scale / old - focus.x;
    viewport.scrollTop = (viewport.scrollTop + focus.y) * scale / old - focus.y;
  }
  localStorage.setItem('mv-moodboard-zoom', scale);
}
function fit() { setScale(Math.min(innerWidth / 3000, (innerHeight - 10) / 2010)); viewport.scrollTo(0, 0); }
document.getElementById('in').onclick = () => setScale(scale * 1.2, { x: innerWidth / 2, y: innerHeight / 2 });
document.getElementById('out').onclick = () => setScale(scale / 1.2, { x: innerWidth / 2, y: innerHeight / 2 });
document.getElementById('fit').onclick = fit;
document.getElementById('reset').onclick = () => {
  if (!confirm('Put every card back where it started? Your own notes stay.')) return;
  localStorage.removeItem('mv-moodboard'); location.reload();
};
viewport.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setScale(scale * Math.exp(-e.deltaY * 0.01), { x: e.clientX, y: e.clientY });
}, { passive: false });
let pan = null;
viewport.addEventListener('pointerdown', e => {
  if (e.target !== viewport && e.target !== board && e.target.id !== 'sizer') return;
  pan = { x: e.clientX, y: e.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
  viewport.classList.add('panning');
});
addEventListener('pointermove', e => { if (pan) { viewport.scrollLeft = pan.left - (e.clientX - pan.x); viewport.scrollTop = pan.top - (e.clientY - pan.y); } });
addEventListener('pointerup', () => { pan = null; viewport.classList.remove('panning'); });
const savedZoom = parseFloat(localStorage.getItem('mv-moodboard-zoom'));
savedZoom ? setScale(savedZoom) : fit();

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1400);
}
</script>
</body>
